# Render Blueprint (optional): New -> Blueprint -> pick this repo. Or create the Web Service by hand (README).
services:
  - type: web
    name: proof-bridge-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: STORAGE_PROVIDER
        value: r2
      - key: AI_PROVIDER
        value: gemini
      - key: DISPUTES_PROVIDER
        value: mock
      - key: MOCK_DISPUTES_BASE_URL
        value: https://razorpay-mock-disputes.vercel.app
      - key: JWT_SIGNING_SECRET
        generateValue: true
      - key: DEMO_ADMIN_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MOCK_DISPUTES_WEBHOOK_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: proof-bridge-evidence
      - key: R2_ENDPOINT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
